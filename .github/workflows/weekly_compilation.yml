name: Weekly Long-Form Compilation

on:
  schedule:
    - cron: '0 15 * * 0' # Sundays 10:00 AM EST / 12:00 BRT (weekend = peak long-form viewing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode API Credentials
        env:
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          SECRET_B64: ${{ secrets.CLIENT_SECRET_BASE64 }}
        run: |
          python -c "import os, base64; open('token.pickle', 'wb').write(base64.b64decode(''.join(os.environ['TOKEN_B64'].split()).replace('\`', '')))"
          python -c "import os, base64; open('client_secret.json', 'wb').write(base64.b64decode(''.join(os.environ['SECRET_B64'].split()).replace('\`', '')))"

      - name: Download the Shorts archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archive
          gh release download shorts-archive -D archive --pattern '*' || echo "No archive yet"

      - name: Build and upload compilation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python compilation.py --archive archive --upload

      - name: Save compiled IDs and prune old archive files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_scripts_history.json
          git commit -m "Record compiled Shorts [skip ci]" || echo "No changes to commit"
          git pull --rebase || echo "Rebase failed"
          git push || echo "No changes to push"
          # Keep the release small: drop Shorts older than 45 days (already compiled and reposted)
          cutoff=$(date -d '45 days ago' +%Y-%m-%d)
          gh release view shorts-archive --json assets -q '.assets[].name' 2>/dev/null | while read -r name; do
            if [[ "${name:0:10}" < "$cutoff" ]]; then gh release delete-asset shorts-archive "$name" -y; fi
          done
