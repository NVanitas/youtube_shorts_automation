name: Generate and Post YouTube Short

on:
  schedule:
    - cron: '0 12 * * *' # 7:00 AM EST / 8:00 BRT (US Morning)
    - cron: '0 17 * * *' # 12:00 PM EST / 14:00 BRT (US Lunch)
    - cron: '0 23 * * *' # 6:00 PM EST / 20:00 BRT (US Evening)
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website whenever you want!

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to make runs lightning fast

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode API Credentials
        env:
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          SECRET_B64: ${{ secrets.CLIENT_SECRET_BASE64 }}
        run: |
          # Recreates the authentication files safely using Python to auto-clean copy-paste garbage (like backticks, spaces, newlines)
          python -c "import os, base64; open('token.pickle', 'wb').write(base64.b64decode(os.environ['TOKEN_B64'].strip().replace('\`', '').replace(' ', '').replace('\n', '').replace('\r', '')))"
          python -c "import os, base64; open('client_secret.json', 'wb').write(base64.b64decode(os.environ['SECRET_B64'].strip().replace('\`', '').replace(' ', '').replace('\n', '').replace('\r', '')))"

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # Automatically generates a new 'facts' video and uploads it
          python main.py --niche facts --upload

      - name: Save used_scripts_history.json
        run: |
          # Commits the updated history file back to GitHub so it never repeats the same video next time!
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_scripts_history.json
          git commit -m "Auto-update used scripts history [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
