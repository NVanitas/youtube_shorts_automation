name: Generate and Post YouTube Short

on:
  schedule:
    # 1 post/day: fewer, more distinct videos beat 3 near-duplicates (YouTube suppresses repetitive channels)
    - cron: '0 17 * * *' # 12:00 PM EST / 14:00 BRT (US Lunch)
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website whenever you want!

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to make runs lightning fast

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode API Credentials
        env:
          TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          SECRET_B64: ${{ secrets.CLIENT_SECRET_BASE64 }}
        run: |
          # Recreates authentication files and validates token structure
          python -c "
          import os, base64, sys
          t_raw = base64.b64decode(os.environ['TOKEN_B64'].strip().replace('\`', '').replace(' ', '').replace('\n', '').replace('\r', ''))
          if t_raw.strip().startswith(b'{'):
              print('=' * 65)
              print('[CRITICAL ERROR] YOUTUBE_TOKEN_BASE64 CONTAINS JSON INSTEAD OF PICKLE!')
              print('You pasted the CLIENT_SECRET into YOUTUBE_TOKEN_BASE64 in GitHub Secrets.')
              print('YOUTUBE_TOKEN_BASE64 must be the base64 string starting with gASV...')
              print('=' * 65)
              sys.exit(1)
          open('token.pickle', 'wb').write(t_raw)
          "
          python -c "import os, base64; open('client_secret.json', 'wb').write(base64.b64decode(os.environ['SECRET_B64'].strip().replace('\`', '').replace(' ', '').replace('\n', '').replace('\r', '')))"

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # Automatically generates a new 'facts' video and uploads it
          python main.py --niche facts --upload

      - name: Archive published Short (weekly compilation + TikTok/Reels reposting)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each published Short (mp4 + json with a ready-to-paste TikTok/Reels caption) goes to the
          # 'shorts-archive' release: the weekly compilation reads it, and it's easy to download on a phone
          if ls published/*.mp4 >/dev/null 2>&1; then
            gh release view shorts-archive >/dev/null 2>&1 || gh release create shorts-archive               --title "Shorts archive"               --notes "Every published Short: .mp4 + .json (social_caption = ready-to-paste TikTok/Reels caption). Used by the weekly compilation."
            gh release upload shorts-archive published/* --clobber
          fi

      - name: Save used_scripts_history.json
        if: always() # also when the quality gate rejected every render, so rejected topics are not retried
        run: |
          # Commits the updated history file back to GitHub so it never repeats the same video next time!
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_scripts_history.json
          git commit -m "Auto-update used scripts history [skip ci]" || echo "No changes to commit"
          git pull --rebase || echo "Rebase failed"
          git push || echo "No changes to push"
          python -c "import json; json.load(open('used_scripts_history.json', encoding='utf-8'))"
